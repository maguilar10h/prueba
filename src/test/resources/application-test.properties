# Test Configuration
spring.application.name=prueba-test

# Database Configuration (H2 in-memory for tests)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.packages-to-scan=com.informacolombia.prueba.domain.entities
spring.jpa.defer-datasource-initialization=false

# Flyway Configuration - Disable for tests
spring.flyway.enabled=false

# Redis Configuration - Disable for tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Kafka Configuration - Disabled via autoconfigure.exclude

# JWT Configuration
jwt.secret=test-secret-key-for-testing-only-minimum-256-bits-required-for-security
jwt.expiration=86400000

# Server Configuration
server.port=0

# Actuator Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Swagger Configuration - Disable for tests
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
