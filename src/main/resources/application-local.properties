# Configuration for local development with PostgreSQL
# Copy this file and adjust database connection if needed

spring.application.name=prueba

# Database Configuration (PostgreSQL for local development)
spring.datasource.url=jdbc:postgresql://localhost:5432/prueba_db
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=prueba_user
spring.datasource.password=prueba_password

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=order-service-group
spring.kafka.consumer.auto-offset-reset=earliest

# JWT Configuration
jwt.secret=your-secret-key-change-in-production-use-strong-random-key-minimum-256-bits
jwt.expiration=86400000

# Server Configuration
server.port=8080
